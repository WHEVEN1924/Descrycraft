name: Build 26.3

on:
  push:
    branches: [ 'port/26.3' ]
  pull_request:
    branches: [ 'port/26.3' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == 'port/26.3' || github.base_ref == 'port/26.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (26.3 packaging)
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Descrycraft-26.3-jars
          path: build/libs/*.jar
          if-no-files-found: error
